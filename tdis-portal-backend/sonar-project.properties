# --- Project Identity ---
sonar.projectKey=tdis-portal-backend
sonar.projectName=TDIS Portal Backend (Node.js Express API)
sonar.projectVersion=1.0.0

# --- Paths ---
sonar.sources=app.js,server.js,config,controllers,emails,routes
sonar.tests=__tests__
sonar.exclusions=**/node_modules/**,**/coverage/**,**/*.test.js

# --- Quality & Reports ---
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
