# SonarQube — TDIS Portal Frontend (Vite + React)
# Layout: application code in src/, Vitest suite in tests/.

sonar.projectKey=tdis-portal-frontend
sonar.projectName=TDIS Portal Frontend (tdis-portal-frontend)
# Align with package.json version; override in CI if you inject a build tag.
sonar.projectVersion=0.0.0

# --- Paths ---
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js,tests/**/*.test.jsx

# --- Exclusions (global) ---
sonar.exclusions=**/node_modules/**,dist/**,coverage/**,*.config.js,staticwebapp.config.json,public/**

# --- Coverage exclusions ---
# Mirror vitest.config.js coverage.exclude so Sonar coverage math matches local CI thresholds.
sonar.coverage.exclusions=\
  src/main.jsx,\
  src/**/index.js,\
  src/**/*.css,\
  src/components/ui/**/*,\
  src/hooks/useMapboxMap.js,\
  src/hooks/useOSAMapLayers.js,\
  src/hooks/useBaronRainfallGridMapLayers.js,\
  src/hooks/useLtsMapLayers.js,\
  src/hooks/useHMEDMapLayers.js,\
  src/hooks/useHMEDFloodHubOverlays.js,\
  src/hooks/useHazardLayers.js,\
  src/hooks/useHazardMapClick.js,\
  src/hooks/useMapResize.js,\
  src/services/mapService.js,\
  src/services/mapRefreshService.js,\
  src/utils/criticalFacilitiesMapLayers.js,\
  src/components/MapSection.jsx,\
  src/components/LtsFlashFloodTab.jsx,\
  src/components/ActiveWeatherEventsBetaTab.jsx,\
  src/components/ai-assistant/AIAssistantMap.jsx,\
  src/api/cubeClient.js,\
  src/config/**/*,\
  src/data/**/*

# --- Reports ---
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
